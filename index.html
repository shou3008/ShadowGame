<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シルエット投影</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="toolbar">
        <div class="tool-group">
          <label for="ctrl-camera">カメラ</label>
          <select id="ctrl-camera"><option>読み込み中...</option></select>
        </div>
        <div class="tool-group">
          <label class="check"><input type="checkbox" id="ctrl-flip" checked>左右反転</label>
        </div>
        <div class="tool-group">
          <label for="ctrl-scale">解像度</label>
          <input type="range" id="ctrl-scale" min="10" max="100" step="5" value="100">
          <span id="ctrl-scale-val">-- px</span>
        </div>
        <div class="tool-group">
          <label for="ctrl-cell">間隔</label>
          <input type="range" id="ctrl-cell" min="6" max="60" step="1" value="18">
          <span id="ctrl-cell-val">18px</span>
        </div>
        <div class="tool-group">
          <label for="ctrl-fg">影</label>
          <input type="color" id="ctrl-fg" value="#000000">
          <label for="ctrl-hand">手先</label>
          <input type="color" id="ctrl-hand" value="#ff0000">
          <label for="ctrl-head">頭</label>
          <input type="color" id="ctrl-head" value="#3399ff">
          <label for="ctrl-leg">膝下</label>
          <input type="color" id="ctrl-leg" value="#22cc44">
          <label for="ctrl-bg">背景</label>
          <input type="color" id="ctrl-bg" value="#ffffff">
        </div>
        <div class="tool-group spacer">
          <span id="status">初期化中...</span>
          <span id="fps">-- fps</span>
          <button id="ui-toggle" title="ツールバーを隠す">×</button>
        </div>
      </div>
      <button id="ui-show" title="設定を表示" hidden>⚙</button>
    </div>
    <script>
      (function () {
        const toolbar = document.getElementById('toolbar');
        const showBtn = document.getElementById('ui-show');
        document.getElementById('ui-toggle').addEventListener('click', () => {
          toolbar.hidden = true;  showBtn.hidden = false;
        });
        showBtn.addEventListener('click', () => {
          toolbar.hidden = false; showBtn.hidden = true;
        });
      })();
    </script>
  </div>
  <video id="video" autoplay playsinline></video>

  <script type="module" src="src/app.js"></script>
</body>
</html>
